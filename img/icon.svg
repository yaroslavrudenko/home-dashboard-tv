<svg xmlns="http://www.w3.org/2000/svg" width="512" height="423" viewBox="0 0 512 423">
  <!-- Home Dashboard tile: a clock face with a soft sun rising behind it, on the app's navy gradient.
       512×423 is the Samsung Smart TV tile ratio (square icons are stretched). Rendered to icon.png by
       tools/make-icon.mjs; only the PNG is packaged. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#2a3658"/>
      <stop offset="0.55" stop-color="#18203a"/>
      <stop offset="1" stop-color="#10141f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.36" r="0.5">
      <stop offset="0" stop-color="#ffd58f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd58f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="423" fill="url(#bg)"/>
  <rect width="512" height="423" fill="url(#glow)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- sun, upper right, half behind the clock -->
    <g stroke="#ffd58f" stroke-width="9">
      <circle cx="318" cy="150" r="46"/>
      <line x1="318" y1="64" x2="318" y2="84"/>
      <line x1="379" y1="89" x2="365" y2="103"/>
      <line x1="404" y1="150" x2="384" y2="150"/>
      <line x1="379" y1="211" x2="365" y2="197"/>
    </g>
    <!-- clock face: a glass disc with a faint light border -->
    <circle cx="226" cy="236" r="104" fill="#1b2440" stroke="#ffffff" stroke-opacity="0.9" stroke-width="9"/>
    <g stroke="#ffffff" stroke-opacity="0.45" stroke-width="6">
      <line x1="226" y1="148" x2="226" y2="160"/>
      <line x1="314" y1="236" x2="302" y2="236"/>
      <line x1="226" y1="324" x2="226" y2="312"/>
      <line x1="138" y1="236" x2="150" y2="236"/>
    </g>
    <g stroke="#ffffff" stroke-width="10">
      <line x1="226" y1="236" x2="226" y2="178"/>
      <line x1="226" y1="236" x2="268" y2="258"/>
    </g>
    <circle cx="226" cy="236" r="7" fill="#ffffff" stroke="none"/>
  </g>
</svg>
