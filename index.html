<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Home Dashboard</title>
<link rel="stylesheet" href="css/app.css">
<script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body>
<div id="stage">
  <section id="screen-main" class="screen is-active">
    <section id="clocks" class="clocks"></section>
    <section class="main">
      <div class="col-left">
        <div id="now" class="card now"></div>
        <div class="card hourly-card">
          <div id="hourly" class="hourly"></div>
          <div id="status" class="status"></div>
        </div>
      </div>
      <div id="daily" class="card daily"></div>
    </section>
  </section>
  <section id="screen-israel" class="screen"></section>
  <section id="screen-news" class="screen"></section>
  <section id="screen-markets" class="screen"></section>
  <section id="screen-traffic" class="screen"></section>
  <section id="screen-map" class="screen"></section>
  <section id="screen-alerts" class="screen"></section>
  <div id="corner" class="corner"></div>
  <div id="dots" class="dots" dir="ltr"></div>
  <div id="banner" class="banner" role="status"></div>
</div>
<div id="toast" class="toast" role="status"></div>
<div id="city" class="city" role="dialog"></div>
<script src="js/config.js"></script>
<script src="js/cities.js"></script>
<script src="js/homecity.js"></script>
<script src="js/i18n.js"></script>
<script src="js/tz.js"></script>
<script src="js/html.js"></script>
<script src="js/net.js"></script>
<script src="js/refresher.js"></script>
<script src="js/weather.js"></script>
<script src="js/news.js"></script>
<script src="js/ledger.js"></script>
<script src="js/traffic.js"></script>
<script src="js/trafficmap.js"></script>
<script src="js/alerts.js"></script>
<script src="js/onview.js"></script>
<script src="js/alerts-history.js"></script>
<script src="js/markets.js"></script>
<script src="js/screens.js"></script>
<script src="js/alert-sound.js"></script>
<script src="js/chime.js"></script>
<script src="js/icons.js"></script>
<script src="js/view.js"></script>
<script src="js/view-israel.js"></script>
<script src="js/view-news.js"></script>
<script src="js/view-markets.js"></script>
<script src="js/view-traffic.js"></script>
<script src="js/view-map.js"></script>
<script src="js/view-alert.js"></script>
<script src="js/view-alerts.js"></script>
<script src="js/view-banner.js"></script>
<script src="js/view-city.js"></script>
<script src="js/player-behind.js"></script>
<script src="js/app.js"></script>
</body>
</html>
